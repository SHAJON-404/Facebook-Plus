name: Feature Request
description: Suggest an idea or new feature for Facebook Plus
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: feature_description
    attributes:
      label: Feature Description
      description: Explain the feature you would like to see and how it should work.
      placeholder: Describe your idea or feature request clearly...
    validations:
      required: true

  - type: textarea
    id: additional_info
    attributes:
      label: Additional Context (Optional)
      description: Add any screenshots, references, or mockups if applicable.
