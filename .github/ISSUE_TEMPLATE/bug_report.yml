name: Bug Report
description: Create a report to help us improve Facebook Plus
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill out the details below as accurately as possible to help us identify and fix the issue.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I confirmed there are no duplicate issues reported.
          required: true
        - label: I am using the latest version of Facebook Plus.
          required: true

  - type: dropdown
    id: install_type
    attributes:
      label: Installation Method
      options:
        - Sideloaded (AltStore / Sidestore / TrollStore / Sideloadly)
        - Jailbreak (Rootless / Rootful .deb)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: input
    id: device_info
    attributes:
      label: Device & iOS Version
      placeholder: "e.g., iPhone 14 Pro, iOS 17.2"
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: Facebook App Version
      placeholder: "e.g., v450.0.0"
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Screenshots or Logs
      description: Attach screenshots, screen recordings, or crash logs if applicable.
